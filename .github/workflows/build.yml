name: Build and publish beta release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pvp-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download current Dalamud development assemblies
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - run: dotnet restore PvPSentinel.csproj --locked-mode

      - name: Verify pinned SentinelCore UI package
        shell: pwsh
        run: |
          $expected = 'e1a9ce4e1ce36042c0fcd53f4c23874d918640be10eef16c21f1cd436c6ba747'
          $package = '.packages/SentinelCore/v0.3.1.0/MarshalTitan.SentinelCore.UI.0.3.1.nupkg'
          $actual = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SentinelCore.UI package hash mismatch: $actual" }

      - name: Require release tag to match project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content PvPSentinel.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match project version '$version'. Bump <Version> before distributing a new build."
          }

      - run: dotnet build PvPSentinel.csproj -c Release --no-restore

      - name: Run pure logic tests
        run: dotnet run --project Tests/PvPSentinel.LogicTests.csproj -c Release

      - name: Prepare installable package
        shell: pwsh
        run: Copy-Item bin/Release/PvPSentinel/latest.zip bin/Release/PvPSentinel/PvPSentinel.zip

      - name: Validate release package and bundled Core assemblies
        shell: pwsh
        run: |
          [xml]$project = Get-Content PvPSentinel.csproj
          ./.github/scripts/Validate-Package.ps1 `
            -PackagePath 'bin/Release/PvPSentinel/PvPSentinel.zip' `
            -ExpectedVersion ([string]$project.Project.PropertyGroup.Version)

      - uses: actions/upload-artifact@v4
        with:
          name: PvPSentinel-release
          path: bin/Release/PvPSentinel/PvPSentinel.zip
          if-no-files-found: error

      - name: Read distribution version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'PvPSentinel.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Invalid version $version" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content PvPSentinel.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; build verification is complete."
            exit 0
          }

          gh release create $tag bin/Release/PvPSentinel/PvPSentinel.zip `
            --target $env:GITHUB_SHA `
            --title "PvPSentinel $version (beta)" `
            --notes "Fix Sentinel Modern minimize: keep the shared Core themed header, readiness pill, page label, and expand control visible in a compact window. Preserve the expanded size and Classic native title bar. Frontline automation, combat, and Core.UI 0.3.1 are unchanged."
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release $tag."
          }

      - name: Verify published ZIP and authoritative child manifest
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          [xml]$project = Get-Content PvPSentinel.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/PvPSentinel.zip"
          $download = Join-Path $env:RUNNER_TEMP 'public-PvPSentinel.zip'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -Uri "$url`?release=${{ github.run_id }}-$attempt" -OutFile $download
              ./.github/scripts/Validate-Package.ps1 -PackagePath $download -ExpectedVersion $version
              break
            }
            catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 5
            }
          }

      - name: Publish authoritative child manifest and verify central catalog
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: MarshalTitan/Sentinel/.github/actions/distribute@4bbc5ce50837b37c8cfaee5c39a075c4f68858ed
        with:
          internal-name: PvPSentinel
          version: ${{ steps.version.outputs.value }}
          tag: ${{ steps.version.outputs.tag }}
          notification-token: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
