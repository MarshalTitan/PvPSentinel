name: Build and publish beta release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download current Dalamud development assemblies
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - run: dotnet restore PvPSentinel.csproj

      - name: Require release tag to match project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content PvPSentinel.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match project version '$version'. Bump <Version> before distributing a new build."
          }

      - run: dotnet build PvPSentinel.csproj -c Release --no-restore

      - name: Run pure logic tests
        run: dotnet run --project Tests/PvPSentinel.LogicTests.csproj -c Release

      - name: Prepare installable package
        shell: pwsh
        run: Copy-Item bin/Release/PvPSentinel/latest.zip bin/Release/PvPSentinel/PvPSentinel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PvPSentinel-release
          path: bin/Release/PvPSentinel/PvPSentinel.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content PvPSentinel.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; build verification is complete."
            exit 0
          }

          gh release create $tag bin/Release/PvPSentinel/PvPSentinel.zip `
            --target $env:GITHUB_SHA `
            --title "PvPSentinel $version (beta)" `
            --notes "Refines Secure discovery from the complete v0.3.0.8 match. SEC-CENTER and coordinate-bearing labels are live-confirmed. The observed Storm Landing/base marker and the previously observed south landing family now remain raw evidence and cannot create navigation buttons. Retained research notes now store only the final bounded sensor snapshot instead of every changing counter value, substantially reducing summary.json size while preserving objective transitions. The trace confirms center travel safely recovered from vnavmesh's sparse false shortcut and followed the full ramp route; no unverified hard-coded ramp was added. Manual-only navigation, Company Chocobo travel, combat handoff, terminal death/STOP behavior, and all safety gates remain intact. Autonomous strategy, queue/requeue, and provider-independent LB automation remain disabled; Native MCH remains Shadow / Observe by default."
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release $tag."
          }
