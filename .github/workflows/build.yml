name: Build and publish beta release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download current Dalamud development assemblies
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dalamudDir -Force
          Remove-Item dalamud.zip

      - run: dotnet restore PvPSentinel.csproj

      - name: Require release tag to match project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content PvPSentinel.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match project version '$version'. Bump <Version> before distributing a new build."
          }

      - run: dotnet build PvPSentinel.csproj -c Release --no-restore

      - name: Run pure logic tests
        run: dotnet run --project Tests/PvPSentinel.LogicTests.csproj -c Release

      - name: Prepare installable package
        shell: pwsh
        run: Copy-Item bin/Release/PvPSentinel/latest.zip bin/Release/PvPSentinel/PvPSentinel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PvPSentinel-release
          path: bin/Release/PvPSentinel/PvPSentinel.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content PvPSentinel.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; build verification is complete."
            exit 0
          }

          gh release create $tag bin/Release/PvPSentinel/PvPSentinel.zip `
            --target $env:GITHUB_SHA `
            --title "PvPSentinel $version (beta)" `
            --notes "Adds explicit discovery/manual-M2 support for all five current Frontline maps, with Onsal Hakair prioritized for live testing and a Worqor Chirteh discovery scaffold. Testing Controls and map research now switch automatically to the active adapter, and raw observations remain separate from bounded stable navigation destinations. The final Secure trace produced five ARRIVED routes and confirmed classification, Company Chocobo travel, combat yield/resume, STOP, and death cancellation; this release fixes the observed 480/0 marker flicker, filters player pets from physical objective confirmation, bounds retained transitions, and accepts the bounded mounted actor/ground-mesh height offset after a generated stage is followed. Shatter, Seal Rock, SEC-CENTER, landing exclusions, staged vnavmesh recovery, and provider boundaries are preserved. Autonomous strategy, objective navigation, queue/requeue, and provider-independent LB execution remain disabled; Native MCH remains Shadow / Observe by default."
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release $tag."
          }
